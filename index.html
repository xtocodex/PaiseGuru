    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Apply the saved appearance before the first paint (no flash). "system" follows the phone.
      try {
        var t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t
          // The status bar follows the chosen appearance, not only the phone's (pwa.ts setTheme does the same).
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.content = t === 'dark' ? '#0b1020' : '#f3f5fa'
          })
        }
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>

  </body>
